[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "switchyard"
version = "1.0.0"
description = "Operational Exception & Service Reliability Workbench"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Hriday Singh Sobti", email = "hridaysobti@gmail.com" }
]
dependencies = [
    "duckdb>=1.1.0",
    "pyarrow>=17.0.0",
    "pandas>=2.2.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "fastapi>=0.112.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.0",
    "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = [
    ".",
]
